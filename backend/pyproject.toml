[project]
name = "shift-log"
version = "0.1.0"
description = "Driver shift log API: trips per day, daily summary, idempotent trip creation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "RET", "C4"]

[tool.mypy]
strict = true
packages = ["shift_log"]
plugins = ["pydantic.mypy"]
