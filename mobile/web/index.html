<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Дневник смен водителя: выручка, комиссия и поездки за день.">
  <meta name="theme-color" content="#F5F5F7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Дневник смен">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Дневник смен водителя</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown until Flutter paints its first frame on top. */
    html, body { margin: 0; height: 100%; background: #F5F5F7; }
    .boot { position: fixed; inset: 0; display: grid; place-items: center; }
    .boot span {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(29, 29, 31, 0.12); border-top-color: #0071E3;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #000000; }
      .boot span { border-color: rgba(245, 245, 247, 0.16); border-top-color: #0A84FF; }
    }
  </style>
</head>
<body>
  <div class="boot" aria-label="Загрузка"><span></span></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
