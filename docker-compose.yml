services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SHIFT_LOG_TIMEZONE: Asia/Almaty
    volumes:
      # Trips added through the API survive container restarts.
      - shift-log-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  shift-log-data:
